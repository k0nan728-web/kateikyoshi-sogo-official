<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Responsive QA — development only</title>
<style>body{margin:0;background:#cbd2da}#stage{margin:12px auto;background:white}iframe{border:0;transform-origin:top left}</style>
<div id="stage"><iframe id="site" title="検証対象"></iframe></div>
<script>
const params=new URLSearchParams(location.search);
const width=Number(params.get('w')||390), height=Number(params.get('h')||844);
const frame=document.querySelector('#site'),stage=document.querySelector('#stage');
const scale=Math.min(1,(innerWidth-32)/width);
Object.assign(frame.style,{width:width+'px',height:height+'px',transform:`scale(${scale})`});
Object.assign(stage.style,{width:width*scale+'px',height:height*scale+'px'});
frame.onload=async()=>{
 stage.dataset.qaPhase='frame-loaded';
 const doc=frame.contentDocument;
 const qaStyle=doc.createElement('style');
 qaStyle.textContent='html{scroll-behavior:auto!important}';
 doc.head.append(qaStyle);
 if(params.has('open'))doc.querySelectorAll('details').forEach(e=>e.open=true);
 if(params.has('root'))doc.documentElement.style.fontSize=params.get('root')+'px';
 stage.dataset.qaPhase='fonts-loading';
 await doc.fonts.ready;
 stage.dataset.qaPhase='fonts-ready';
 frame.contentWindow.dispatchEvent(new Event('resize'));
 requestAnimationFrame(()=>requestAnimationFrame(()=>{
  const section=params.get('section');
  if(section){doc.getElementById(section)?.scrollIntoView();}
  if(params.has('promise'))doc.querySelectorAll('.promise-card')[Number(params.get('promise'))]?.scrollIntoView();
  const qaOverflow=Array.from(doc.querySelectorAll('main *')).filter(e=>e.clientWidth>0 && e.scrollWidth>e.clientWidth+2).map(e=>({tag:e.tagName,cls:e.className,over:e.scrollWidth-e.clientWidth}));
  const out=document.createElement('pre');out.id='qa-result';out.textContent=JSON.stringify({width,root:params.get('root')||16,pageOverflow:doc.documentElement.scrollWidth-doc.documentElement.clientWidth,local:qaOverflow,details:doc.querySelectorAll('details[open]').length,section:section||'top'});document.body.append(out);
  document.title='QA ready: '+width+'×'+height;
  stage.dataset.qaReady='true';
 }));
};
frame.src='/';
</script></html>
