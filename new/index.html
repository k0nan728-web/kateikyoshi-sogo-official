/* Hero: one semantic section, original photo, intrinsic reflow. */
.hero-layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:32px clamp(24px,5vw,72px)}
.hero-name{font-weight:700;font-size:1rem;margin:0;color:#31566c}
.intro h1&gt;span{display:block}.hero-future{color:#20694f}
.hero-subjects{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;list-style:none;margin:0 0 22px;padding:0}
.hero-subjects li{padding:6px 12px;background:#fff;border-bottom:3px solid #397fc8;border-radius:4px;font-weight:700;font-size:.9375rem}
.hero-subjects li:nth-child(2){border-color:#c93668}.hero-subjects li:nth-child(3){border-color:#348b63}.hero-subjects li span{display:inline-block;font-size:.8125rem}
.hero-lead{font-size:1rem;line-height:2;color:#365468;margin-bottom:24px}
.hero-cta{display:inline-flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:8px 24px;max-width:100%;background:#f1ce70;color:#102d4c;box-shadow:0 8px 24px #102d4c15;line-height:1.6}
.hero-cta:hover{background:#ffdf8b;color:#102d4c}.hero-note{font-size:.875rem;color:#365468;margin:12px 0 0}
.hero-evidence{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,14rem),1fr));margin:0;background:#0b2942;color:#fff;padding:24px clamp(12px,3vw,32px);border-radius:16px 16px 0 0;gap:24px}
.hero-evidence&gt;div{text-align:center;min-width:0}.hero-evidence dt{font-size:.875rem;color:#dbe8ef}.hero-evidence dd{font:700 clamp(2.5rem,4.5vw,3.75rem)/1.4 var(--serif);margin:4px 0 0;font-variant-numeric:tabular-nums}.hero-evidence dd span{font:700 1rem var(--sans);display:inline-block;margin-left:6px}
@media(max-width:800px){.hero-layout{grid-template-columns:minmax(0,1fr)}.lesson-photo{max-width:340px}.intro h1{font-size:clamp(2rem,6vw,2.75rem)}.hero-evidence{border-radius:12px 12px 0 0}}
@media(min-width:801px){.hero-evidence&gt;div+div{border-left:1px solid #ffffff40}}
.text-enlarged .hero-layout{grid-template-columns:minmax(0,1fr)}

/* Brand pathways: two subject panels and two spacious support / restart rows. */
.path-intro,.path-detail{min-width:0;padding:clamp(20px,3vw,32px)}
.path-intro{border-radius:16px 16px 0 0;border-bottom:1px solid #ccdce5}
.path-detail{display:flex;flex-direction:column;align-items:stretch}
.path-detail&gt;p{color:var(--muted)}
.path-intro h3{font-size:clamp(1.25rem,2.2vw,1.7rem);margin-bottom:20px}
.brand-signal{display:flex;flex-wrap:wrap;align-items:center;gap:10px;color:var(--path-color);font-weight:700}
.path-blue .brand-signal span{border:1px solid #b3ccdf;border-radius:50%;padding:10px;background:#fff}
.path-gold .brand-signal{border-top:1px solid #e6bdcd;padding-top:14px;justify-content:space-between}
.path-green .brand-signal{border-left:3px solid var(--path-color);padding:8px 14px;background:#fff;border-radius:0 20px 20px 20px}
.path-rose .brand-signal&gt;span:first-child{font:700 3rem/1.2 var(--serif)}
.comparison&gt;a:hover{color:#fff;background:#123c59}
.comparison-button{display:flex;flex-direction:column;gap:5px;padding:20px;text-align:center;text-decoration:none;background:#0b2942;color:#fff;border-radius:10px}
.comparison-button&gt;span{font-size:.875rem}.comparison-button strong{font-size:1.25rem}.comparison-button:hover{background:#174e70;color:#fff}
.voice-grid--parents figure:not(:first-child){background:transparent;color:#fff;border:0;border-top:1px solid #6a8195;border-radius:0;padding:28px 0}
.voice-grid--parents figure:not(:first-child) figcaption,.voice-grid--parents figure:not(:first-child) figcaption strong{color:#dae8f2}
.voice-grid--parents figure:not(:first-child) .voice-result{display:inline-block;background:#24465e;color:#fff;margin-bottom:16px}
.voice-grid--parents figure:not(:first-child) blockquote{font-family:var(--sans);font-size:1rem}
@container voices (min-width:48rem){
.voice-grid--parents{grid-template-columns:repeat(3,minmax(0,1fr));gap:32px}
.voice-grid--parents figure:first-child{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);column-gap:40px;padding:40px}
.voice-grid--parents figure:first-child .voice-result{grid-column:1;align-self:start}
.voice-grid--parents figure:first-child .quote-mark{grid-column:1;grid-row:2;width:56px;height:56px}
.voice-grid--parents figure:first-child blockquote{grid-column:2;grid-row:1/3;font-size:1.375rem}
.voice-grid--parents figure:first-child figcaption{grid-column:2}
}
@media(min-width:761px){
.brand-path.path-green,.brand-path.path-rose{grid-column:1/-1;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);grid-template-rows:auto}
.path-green .path-intro,.path-rose .path-intro{border-radius:16px 0 0 16px;border-bottom:0;border-right:1px solid #ccdce5}
}
.text-enlarged .brand-grid{grid-template-columns:minmax(0,1fr)}
.text-enlarged .brand-path.path-green,.text-enlarged .brand-path.path-rose{grid-template-columns:minmax(0,1fr)}
.text-enlarged .path-intro{border-right:0;border-bottom:1px solid #ccdce5}

/* Warm educational direction: intrinsic layouts, compact mobile chapters. */

&lt;h3&gt;保護者との連携も丁寧に&lt;/h3&gt;
&lt;p&gt;
                学習状況をご家庭と共有し、お子様への関わり方や進路の見通しも一緒に考えます。
              &lt;/p&gt;
&lt;/article&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;support-stories&quot; id=&quot;support-cases&quot;&gt;&lt;div class=&quot;section-shell&quot;&gt;&lt;div class=&quot;section-heading&quot;&gt;&lt;p class=&quot;eyebrow&quot;&gt;SUPPORT STORIES&lt;/p&gt;&lt;h2&gt;&lt;span class=&quot;semantic-unit&quot;&gt;不登校・発達特性。&lt;/span&gt;&lt;br/&gt;&lt;span class=&quot;semantic-unit&quot;&gt;それぞれのペースで、&lt;/span&gt;&lt;span class=&quot;semantic-unit&quot;&gt;つかんだ成果。&lt;/span&gt;&lt;/h2&gt;&lt;/div&gt;&lt;p class=&quot;section-lead&quot;&gt;学びの入口は、一人ひとり違っていい。&lt;br/&gt;結果だけでなく、そこに至る小さな一歩をご紹介します。&lt;/p&gt;&lt;div class=&quot;success-stories&quot;&gt;&lt;article class=&quot;story-band story-1&quot;&gt;&lt;div class=&quot;story-result&quot;&gt;&lt;span class=&quot;story-number&quot;&gt;01&lt;/span&gt;&lt;p class=&quot;ux-label&quot;&gt;不登校 × 英検合格&lt;/p&gt;&lt;p&gt;中学3年間不登校から、&lt;/p&gt;&lt;h3&gt;&lt;span class=&quot;semantic-unit&quot;&gt;英検2級&lt;/span&gt;&lt;span class=&quot;semantic-unit&quot;&gt;合格&lt;/span&gt;&lt;/h3&gt;&lt;dl class=&quot;story-meta&quot;&gt;&lt;div&gt;&lt;dt&gt;生徒&lt;/dt&gt;&lt;dd&gt;中学生&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;指導期間&lt;/dt&gt;&lt;dd&gt;約1年&lt;/dd&gt;&lt;/div&gt;&lt;/dl&gt;&lt;/div&gt;&lt;div class=&quot;story-body&quot;&gt;&lt;details&gt;&lt;summary&gt;この結果までの経過を読む&lt;/summary&gt;&lt;div class=&quot;details-body&quot;&gt;&lt;p&gt;中学英語の基礎から学び直し。カメラを使わず、テキストチャットでのやり取りから関係を築き、アルファベットから少しずつ学習しました。&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;p class=&quot;story-small-title&quot;&gt;本人の声&lt;/p&gt;&lt;blockquote&gt;「先生と話すのが毎週の楽しみになりました」&lt;/blockquote&gt;&lt;/div&gt;&lt;/article&gt;&lt;article class=&quot;story-band story-2&quot;&gt;&lt;div class=&quot;story-result&quot;&gt;&lt;span class=&quot;story-number&quot;&gt;02&lt;/span&gt;&lt;p class=&quot;ux-label&quot;&gt;不登校 × 大学受験&lt;/p&gt;&lt;p&gt;高1冬の基礎学習から、&lt;/p&gt;&lt;h3&gt;&lt;span class=&quot;semantic-unit&quot;&gt;難関大学に&lt;/span&gt;&lt;span class=&quot;semantic-unit&quot;&gt;現役合格&lt;/span&gt;&lt;/h3&gt;&lt;dl class=&quot;story-meta&quot;&gt;&lt;div&gt;&lt;dt&gt;生徒&lt;/dt&gt;&lt;dd&gt;高校生&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;指導期間&lt;/dt&gt;&lt;dd&gt;高1冬〜高3&lt;/dd&gt;&lt;/div&gt;&lt;/dl&gt;&lt;/div&gt;&lt;div class=&quot;story-body&quot;&gt;&lt;details&gt;&lt;summary&gt;この結果までの経過を読む&lt;/summary&gt;&lt;div class=&quot;details-body&quot;&gt;&lt;p&gt;アルファベットから始め、英検3級、準2級、2級、準1級へ。早稲田大学などの合格につながりました。&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;p class=&quot;story-small-title&quot;&gt;本人の声&lt;/p&gt;&lt;blockquote&gt;「不登校でも、ちゃんと夢を叶えられると証明できた」&lt;/blockquote&gt;&lt;/div&gt;&lt;/article&gt;&lt;article class=&quot;story-band story-3&quot;&gt;&lt;div class=&quot;story-result&quot;&gt;&lt;span class=&quot;story-number&quot;&gt;03&lt;/span&gt;&lt;p class=&quot;ux-label&quot;&gt;発達特性 × 英検合格&lt;/p&gt;&lt;p&gt;自分に合う学び方で、&lt;/p&gt;&lt;h3&gt;&lt;span class=&quot;semantic-unit&quot;&gt;英検3級&lt;/span&gt;&lt;span class=&quot;semantic-unit&quot;&gt;合格&lt;/span&gt;&lt;/h3&gt;&lt;dl class=&quot;story-meta&quot;&gt;&lt;div&gt;&lt;dt&gt;生徒&lt;/dt&gt;&lt;dd&gt;中学生&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;指導期間&lt;/dt&gt;&lt;dd&gt;約8か月&lt;/dd&gt;&lt;/div&gt;&lt;/dl&gt;&lt;/div&gt;&lt;div class=&quot;story-body&quot;&gt;&lt;details&gt;&lt;summary&gt;この結果までの経過を読む&lt;/summary&gt;&lt;div class=&quot;details-body&quot;&gt;&lt;p&gt;集中の維持が難しく、塾での学習が合わなかった生徒さん。1対1で本人のペースに合わせ、ゲームを交えた単語学習などを取り入れました。&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;p class=&quot;story-small-title&quot;&gt;本人の声&lt;/p&gt;&lt;blockquote&gt;「初めて勉強が楽しいと思えた」&lt;/blockquote&gt;&lt;/div&gt;&lt;/article&gt;&lt;/div&gt;&lt;p class=&quot;fine-print&quot;&gt;既存公開事例を再構成。学年・期間は掲載時のものです。個人の成果であり、同様の結果を保証するものではありません。&lt;/p&gt;&lt;a class=&quot;story-consult&quot; href=&quot;#contact&quot;&gt;今の状況から、相談してみませんか。 &lt;span&gt;無料相談について →&lt;/span&gt;&lt;/a&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;lesson-method ivory-section&quot; id=&quot;how-we-teach&quot; data-heading=&quot;overview&quot;&gt;
&lt;div class=&quot;section-shell&quot;&gt;
&lt;div class=&quot;section-heading&quot;&gt;&lt;svg class=&quot;chapter-icon&quot; aria-hidden=&quot;true&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.5&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;&gt;&lt;path d=&quot;M12 5C8 2 3 3 2 4v15c4-2 7-1 10 1 3-2 6-3 10-1V4c-4-2-7-1-10 1v15&quot;/&gt;&lt;/svg&gt;
&lt;p class=&quot;eyebrow&quot;&gt;HOW WE TEACH&lt;/p&gt;
&lt;h2 data-fit-lines=&quot;&quot; data-fit-min=&quot;20&quot;&gt;
&lt;span&gt;自宅からつながる、&lt;/span&gt;&lt;span&gt;顔の見える個別指導。&lt;/span&gt;
&lt;/h2&gt;
&lt;/div&gt;
&lt;p class=&quot;section-lead&quot;&gt;
            Zoom・&lt;span class=&quot;semantic-unit&quot;&gt;Google Meet&lt;/span&gt;で画面を共有し、解き方や考え方を一緒に確認します。
          &lt;/p&gt;
&lt;div class=&quot;lesson-layout&quot;&gt;&lt;figure class=&quot;lesson-video&quot;&gt;&lt;video aria-label=&quot;鈴木雄太の自己紹介動画&quot; controls playsinline poster=&quot;https://kateikyoshi-sogo.com/new/teacher-intro-poster.jpg&quot; preload=&quot;none&quot;&gt;&lt;source src=&quot;https://kateikyoshi-sogo.com/new/teacher_intro_clean_403456db.mp4&quot; type=&quot;video/mp4&quot;/&gt;&lt;/video&gt;&lt;figcaption&gt;講師本人が、学習の優先順位や指導方針をご紹介します。&lt;/figcaption&gt;&lt;/figure&gt;&lt;ol class=&quot;lesson-steps&quot;&gt;
&lt;li&gt;
&lt;span&gt;授業前&lt;/span&gt;
&lt;h3&gt;今のつまずきを確認&lt;/h3&gt;
&lt;p&gt;目標や理解度を確認し、必要な問題・参考書を選びます。&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;
&lt;span&gt;授業中&lt;/span&gt;
&lt;h3&gt;一緒に解き、考え方を整理&lt;/h3&gt;
&lt;p&gt;
                  画面共有で書き込みながら解説。質問しやすい完全&lt;span class=&quot;semantic-unit&quot;&gt;マンツーマン&lt;/span&gt;&lt;span class=&quot;semantic-unit&quot;&gt;指導です。&lt;/span&gt;
&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;
&lt;span&gt;授業後&lt;/span&gt;
&lt;h3&gt;復習で定着させる&lt;/h3&gt;
&lt;p&gt;宿題や復習課題を用意し、次の授業で取り組みを確認します。&lt;/p&gt;
&lt;/li&gt;
&lt;/ol&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;voices paper-section&quot; id=&quot;voices&quot; data-heading=&quot;overview&quot;&gt;
&lt;div class=&quot;section-shell&quot;&gt;
&lt;div class=&quot;section-heading&quot;&gt;&lt;svg class=&quot;chapter-icon&quot; aria-hidden=&quot;true&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.5&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;&gt;&lt;path d=&quot;M21 15a3 3 0 0 1-3 3H9l-6 4V5a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3Z&quot;/&gt;&lt;path d=&quot;M7 7h10M7 12h7&quot;/&gt;&lt;/svg&gt;&lt;p class=&quot;eyebrow&quot;&gt;VOICES &amp;amp; STORIES&lt;/p&gt;&lt;h2&gt;&lt;span class=&quot;semantic-unit&quot;&gt;&lt;span class=&quot;semantic-unit&quot;&gt;生徒と&lt;/span&gt;&lt;span class=&quot;semantic-unit&quot;&gt;保護者から&lt;/span&gt;&lt;/span&gt;&lt;br/&gt;&lt;span class=&quot;semantic-unit&quot;&gt;寄せられた声。&lt;/span&gt;&lt;/h2&gt;&lt;/div&gt;
&lt;p class=&quot;section-lead&quot;&gt;学ぶ本人の変化と、見守るご家庭の実感。&lt;br/&gt;それぞれの視点から、指導の様子をご紹介します。&lt;/p&gt;
&lt;h3 class=&quot;voice-group-title&quot;&gt;保護者の声&lt;/h3&gt;&lt;div class=&quot;voice-grid voice-grid--parents&quot;&gt;
&lt;figure&gt;&lt;p class=&quot;voice-result&quot;&gt;英検2級合格&lt;/p&gt;&lt;svg class=&quot;quote-mark&quot; aria-hidden=&quot;true&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.5&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;&gt;&lt;path d=&quot;M10 5H3v7h4c0 3-1 4-4 6m18-13h-7v7h4c0 3-1 4-4 6&quot;/&gt;&lt;/svg&gt;&lt;blockquote&gt;先生の指導は非常に丁寧で、子供が英語を楽しめるようになりました。英検2級に合格し、高校受験でも英語が得意科目になりました。本当にありがとうございました。&lt;/blockquote&gt;&lt;figcaption&gt;&lt;strong&gt;H.M様&lt;/strong&gt;中学3年生の保護者&lt;/figcaption&gt;&lt;/figure&gt;
&lt;figure&gt;&lt;p class=&quot;voice-result&quot;&gt;英検2級合格&lt;/p&gt;&lt;svg class=&quot;quote-mark&quot; aria-hidden=&quot;true&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.5&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;&gt;&lt;path d=&quot;M10 5H3v7h4c0 3-1 4-4 6m18-13h-7v7h4c0 3-1 4-4 6&quot;/&gt;&lt;/svg&gt;&lt;blockquote&gt;大学受験に向けて英検2級が必要でしたが、先生の的確な指導のおかげで合格できました。英語の基礎から丁寧に教えていただき、本当に助かりました。&lt;/blockquote&gt;&lt;figcaption&gt;&lt;strong&gt;S.T様&lt;/strong&gt;高校3年生の保護者&lt;/figcaption&gt;&lt;/figure&gt;
&lt;figure&gt;&lt;p class=&quot;voice-result&quot;&gt;英検準2級合格&lt;/p&gt;&lt;svg class=&quot;quote-mark&quot; aria-hidden=&quot;true&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.5&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;&gt;&lt;path d=&quot;M10 5H3v7h4c0 3-1 4-4 6m18-13h-7v7h4c0 3-1 4-4 6&quot;/&gt;&lt;/svg&gt;&lt;blockquote&gt;小学生で準2級に挑戦するのは難しいかと思いましたが、先生の分かりやすい指導のおかげで合格できました。子供の自信にもつながりました。&lt;/blockquote&gt;&lt;figcaption&gt;&lt;strong&gt;S.Y様&lt;/strong&gt;小学6年生の保護者&lt;/figcaption&gt;&lt;/figure&gt;
&lt;figure&gt;&lt;p class=&quot;voice-result&quot;&gt;英検4級合格&lt;/p&gt;&lt;svg class=&quot;quote-mark&quot; aria-hidden=&quot;true&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.5&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;&gt;&lt;path d=&quot;M10 5H3v7h4c0 3-1 4-4 6m18-13h-7v7h4c0 3-1 4-4 6&quot;/&gt;&lt;/svg&gt;&lt;blockquote&gt;英語が苦手だった娘が、先生の指導で英語を好きになりました。4級に合格し、次は3級に挑戦したいと言っています。先生のおかげです。&lt;/blockquote&gt;&lt;figcaption&gt;&lt;strong&gt;O.M様&lt;/strong&gt;小学5年生の保護者&lt;/figcaption&gt;&lt;/figure&gt;
&lt;/div&gt;&lt;h3 class=&quot;voice-group-title&quot;&gt;生徒の声&lt;/h3&gt;&lt;div class=&quot;voice-grid voice-grid--students&quot;&gt;
&lt;figure&gt;&lt;p class=&quot;voice-result&quot;&gt;英検3級 合格&lt;/p&gt;&lt;svg class=&quot;quote-mark&quot; aria-hidden=&quot;true&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.5&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;&gt;&lt;path d=&quot;M10 5H3v7h4c0 3-1 4-4 6m18-13h-7v7h4c0 3-1 4-4 6&quot;/&gt;&lt;/svg&gt;&lt;blockquote&gt;英語が苦手で心配していましたが、先生の丁寧な指導のおかげで短期間で3級に合格することができました。わかりやすく教えていただき、本当にありがとうございました。&lt;/blockquote&gt;&lt;figcaption&gt;&lt;strong&gt;I.Tさん&lt;/strong&gt;中学1年生／生徒&lt;/figcaption&gt;&lt;/figure&gt;
&lt;figure&gt;&lt;p class=&quot;voice-result&quot;&gt;英検2級 合格&lt;/p&gt;&lt;svg class=&quot;quote-mark&quot; aria-hidden=&quot;true&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.5&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;&gt;&lt;path d=&quot;M10 5H3v7h4c0 3-1 4-4 6m18-13h-7v7h4c0 3-1 4-4 6&quot;/&gt;&lt;/svg&gt;&lt;blockquote&gt;高校1年生で2級を取得できたことで、大学入試に向けて大きなアドバンテージになりました。先生の指導は非常にわかりやすく、苦手だったリスニングも克服できました。&lt;/blockquote&gt;&lt;figcaption&gt;&lt;strong&gt;H.Jさん&lt;/strong&gt;高校1年生／生徒&lt;/figcaption&gt;&lt;/figure&gt;
&lt;figure&gt;&lt;p class=&quot;voice-result&quot;&gt;英検準1級 合格&lt;/p&gt;&lt;svg class=&quot;quote-mark&quot; aria-hidden=&quot;true&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.5&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;&gt;&lt;path d=&quot;M10 5H3v7h4c0 3-1 4-4 6m18-13h-7v7h4c0 3-1 4-4 6&quot;/&gt;&lt;/svg&gt;&lt;blockquote&gt;準1級は難しいと聞いていましたが、先生の丁寧な指導と戦略的な学習計画のおかげで合格できました。特に英作文の指導が的確で、二次試験も自信を持って臨めました。&lt;/blockquote&gt;&lt;figcaption&gt;&lt;strong&gt;M.Yさん&lt;/strong&gt;高校2年生／生徒&lt;/figcaption&gt;&lt;/figure&gt;
&lt;/div&gt;&lt;p class=&quot;fine-print&quot;&gt;既存の公式サイトに掲載されているご感想です。学年・成果は掲載時のものです。個人の感想であり、成果には個人差があります。&lt;/p&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;pricing ivory-section&quot; id=&quot;pricing&quot; data-heading=&quot;overview&quot;&gt;
&lt;div class=&quot;section-shell&quot;&gt;
&lt;div class=&quot;section-heading&quot;&gt;&lt;svg class=&quot;chapter-icon&quot; aria-hidden=&quot;true&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.5&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;&gt;&lt;path d=&quot;m6 3 6 9 6-9M5 12h14M5 16h14M12 12v10&quot;/&gt;&lt;/svg&gt;
&lt;p class=&quot;eyebrow&quot;&gt;CLEAR &amp;amp; PERSONAL PRICING&lt;/p&gt;
&lt;h2 data-fit-lines=&quot;&quot; data-fit-min=&quot;20&quot;&gt;
&lt;span&gt;必要な指導と費用を、&lt;/span&gt;&lt;span&gt;納得して選べるように。&lt;/span&gt;
&lt;/h2&gt;
&lt;/div&gt;
&lt;p class=&quot;section-lead&quot;&gt;
            コース・学年・レベルに応じた料金を掲載しています。&lt;br/&gt;表示はすべて税込です。ご相談は無料、&lt;span class=&quot;semantic-unit&quot;&gt;体験授業&lt;/span&gt;は有料です。
          &lt;/p&gt;
&lt;div class=&quot;pricing-intro&quot;&gt;
&lt;div&gt;
&lt;svg class=&quot;topic-icon&quot; aria-hidden=&quot;true&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.5&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;&gt;&lt;rect x=&quot;3&quot; y=&quot;5&quot; width=&quot;18&quot; height=&quot;16&quot; rx=&quot;2&quot;/&gt;&lt;path d=&quot;M7 2v6m10-6v6M3 11h18m-13 4h3m3 0h3&quot;/&gt;&lt;/svg&gt;&lt;span class=&quot;eyebrow&quot;&gt;CONTINUOUS LESSONS&lt;/span&gt;
&lt;h3&gt;継続受講&lt;/h3&gt;&lt;p class=&quot;pricing-number&quot;&gt;&lt;strong&gt;4,000&lt;/strong&gt;&lt;span&gt;円〜 / 60分・税込&lt;/span&gt;&lt;/p&gt;
&lt;p&gt;
                週1回60分以上・月4回以上を3ヶ月以上。曜日・時間帯は原則固定です。
              &lt;/p&gt;
&lt;/div&gt;
&lt;div&gt;
&lt;svg class=&quot;topic-icon&quot; aria-hidden=&quot;true&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.5&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;&gt;&lt;rect x=&quot;4&quot; y=&quot;3&quot; width=&quot;16&quot; height=&quot;19&quot; rx=&quot;2&quot;/&gt;&lt;path d=&quot;m7 8 1 1 2-2m-3 6 1 1 2-2m-3 6 1 1 2-2M13 8h4m-4 5h4m-4 5h4&quot;/&gt;&lt;/svg&gt;&lt;span class=&quot;eyebrow&quot;&gt;SINGLE LESSONS&lt;/span&gt;
&lt;h3&gt;単発・短期&lt;/h3&gt;&lt;p class=&quot;pricing-number&quot;&gt;&lt;strong&gt;1.3&lt;/strong&gt;&lt;span&gt;倍 / 継続料金に対して&lt;/span&gt;&lt;/p&gt;
&lt;p&gt;
                回数を限定して受講したい方、試験前に集中して対策したい方へ。
              &lt;/p&gt;
&lt;/div&gt;
&lt;div&gt;
&lt;svg class=&quot;topic-icon&quot; aria-hidden=&quot;true&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.5&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;&gt;&lt;circle cx=&quot;12&quot; cy=&quot;12&quot; r=&quot;9&quot;/&gt;&lt;circle cx=&quot;12&quot; cy=&quot;12&quot; r=&quot;5&quot;/&gt;&lt;path d=&quot;m10 12 2 2 7-9&quot;/&gt;&lt;/svg&gt;&lt;span class=&quot;eyebrow&quot;&gt;FIRST LESSON&lt;/span&gt;
&lt;h3&gt;体験授業&lt;/h3&gt;&lt;p class=&quot;pricing-number&quot;&gt;&lt;strong&gt;半額&lt;/strong&gt;&lt;span&gt;初回体験・有料&lt;/span&gt;&lt;/p&gt;
&lt;p&gt;
                初回のみ、&lt;span class=&quot;semantic-unit&quot;&gt;継続受講&lt;/span&gt;料金の半額。相性や課題、今後の進め方を確認できます。
              &lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;fine-print&quot;&gt;
            短期間で多くの時間を受講する場合の継続料金適用は、合計時間・日程を確認してご案内します。

&lt;section class=&quot;journal paper-section&quot; id=&quot;journal&quot;&gt;&lt;div class=&quot;section-shell&quot;&gt;&lt;div class=&quot;section-heading&quot;&gt;&lt;svg class=&quot;chapter-icon&quot; aria-hidden=&quot;true&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.5&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;&gt;&lt;path d=&quot;M12 5C8 2 3 3 2 4v15c4-2 7-1 10 1 3-2 6-3 10-1V4c-4-2-7-1-10 1v15&quot;/&gt;&lt;/svg&gt;&lt;p class=&quot;eyebrow&quot;&gt;EDUCATION JOURNAL&lt;/p&gt;&lt;h2&gt;学び方を知る。&lt;br/&gt;次の一歩が見える。&lt;/h2&gt;&lt;/div&gt;&lt;div class=&quot;editorial-grid&quot;&gt;&lt;article class=&quot;editorial-card tone-blue&quot;&gt;&lt;div class=&quot;article-cover&quot; aria-hidden=&quot;true&quot;&gt;&lt;span&gt;英検の勉強、&lt;br/&gt;どこから始める？&lt;/span&gt;&lt;strong&gt;4&lt;small&gt;STEPS&lt;/small&gt;&lt;/strong&gt;&lt;div&gt;目標級 → 現在地 → 試験日 → 4技能&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;ux-label&quot;&gt;英検対策&lt;/p&gt;&lt;time datetime=&quot;2026-08-12&quot;&gt;2026.08.12&lt;/time&gt;&lt;h3&gt;英検の勉強は、何から始める？ 逆算する4つのステップ&lt;/h3&gt;&lt;p&gt;目標級・現在地・試験日・4技能の優先順位を整理。英検学習を遠回りにしないための考え方を解説します。&lt;/p&gt;&lt;a class=&quot;text-link&quot; href=&quot;https://kateikyoshi-sogo.com/blog/?article=eiken-study-roadmap&quot;&gt;記事を読む →&lt;/a&gt;&lt;/article&gt;&lt;article class=&quot;editorial-card tone-rose&quot;&gt;&lt;p class=&quot;ux-label&quot;&gt;大学受験・学習法&lt;/p&gt;&lt;time datetime=&quot;2026-08-05&quot;&gt;2026.08.05&lt;/time&gt;&lt;h3&gt;文系受験、何から立て直す？ 科目の優先順位を決める考え方&lt;/h3&gt;&lt;p&gt;英語・国語・社会を同時に伸ばすために。志望校の配点と現在地から、学習の順番を整理します。&lt;/p&gt;&lt;a class=&quot;text-link&quot; href=&quot;https://kateikyoshi-sogo.com/blog/?article=humanities-exam-priority&quot;&gt;記事を読む →&lt;/a&gt;&lt;/article&gt;&lt;article class=&quot;editorial-card tone-green&quot;&gt;&lt;p class=&quot;ux-label&quot;&gt;不登校・通信制&lt;/p&gt;&lt;time datetime=&quot;2026-07-28&quot;&gt;2026.07.28&lt;/time&gt;&lt;h3&gt;学校に通いづらい時期、学習をどう再開する？&lt;/h3&gt;&lt;p&gt;量よりも、安心して続けられる形を大切に。学習再開の考え方と、保護者の関わり方を紹介します。&lt;/p&gt;&lt;a class=&quot;text-link&quot; href=&quot;https://kateikyoshi-sogo.com/blog/?article=restart-study-at-home&quot;&gt;記事を読む →&lt;/a&gt;&lt;/article&gt;&lt;/div&gt;&lt;p class=&quot;journal-all&quot;&gt;&lt;a class=&quot;text-link&quot; href=&quot;https://kateikyoshi-sogo.com/blog/&quot;&gt;教育コラム一覧を見る →&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;faq ivory-section&quot; id=&quot;faq&quot; data-heading=&quot;overview&quot;&gt;
&lt;div class=&quot;section-shell narrow&quot;&gt;
&lt;div class=&quot;section-heading&quot;&gt;
&lt;svg class=&quot;chapter-icon&quot; aria-hidden=&quot;true&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.5&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;&gt;&lt;path d=&quot;M21 15a3 3 0 0 1-3 3H9l-6 4V5a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3Z&quot;/&gt;&lt;path d=&quot;M7 7h10M7 12h7&quot;/&gt;&lt;/svg&gt;&lt;p class=&quot;eyebrow&quot;&gt;QUESTIONS &amp;amp; ANSWERS&lt;/p&gt;
&lt;h2 data-fit-lines=&quot;&quot; data-fit-min=&quot;20&quot;&gt;
&lt;span&gt;相談前の気がかりに、&lt;/span&gt;&lt;span&gt;お答えします。&lt;/span&gt;
&lt;/h2&gt;
&lt;/div&gt;
&lt;details&gt;
&lt;summary&gt;
&lt;span class=&quot;semantic-unit&quot;&gt;うちの子は&lt;/span&gt;&lt;span class=&quot;semantic-unit&quot;&gt;勉強がかなり苦手で、&lt;/span&gt;&lt;span class=&quot;semantic-unit&quot;&gt;やる気も安定しません。&lt;/span&gt;&lt;span class=&quot;semantic-unit&quot;&gt;それでも大丈夫ですか？&lt;/span&gt;
&lt;/summary&gt;
&lt;div class=&quot;details-body&quot;&gt;
&lt;p&gt;
                はい、大丈夫です。これまでにも、英語がほとんど分からない状態の方、不登校で学習が止まっていた方、集団授業が合わなかった方を多く担当してきました。最初から高い意欲や完成度を求めるのではなく、お子様の現在地に合わせて、できることから一緒に積み上げていきます。
              &lt;/p&gt;
&lt;/div&gt;
&lt;/details&gt;
&lt;details&gt;
&lt;summary&gt;
&lt;span class=&quot;semantic-unit&quot;&gt;カメラオフ&lt;/span&gt;やチャット中心でも受講できますか？
            &lt;/summary&gt;
&lt;div class=&quot;details-body&quot;&gt;
&lt;p&gt;
                はい、可能です。最初は話すことが難しい場合でも、&lt;span class=&quot;semantic-unit&quot;&gt;カメラオフ&lt;/span&gt;・&lt;span class=&quot;semantic-unit&quot;&gt;テキストチャット&lt;/span&gt;中心など、お子様が参加しやすい形から始められます。大切なのは、無理させることではなく、安心してつながれる状態をつくることだと考えています。
              &lt;/p&gt;
&lt;/div&gt;
&lt;/details&gt;
&lt;details&gt;
&lt;summary&gt;問い合わせ後に、すぐ契約しないといけませんか？&lt;/summary&gt;
&lt;div class=&quot;details-body&quot;&gt;
&lt;p&gt;
                いいえ、そのようなことはありません。まずはご相談や&lt;span class=&quot;semantic-unit&quot;&gt;体験授業&lt;/span&gt;を通じて、ご家庭に合うかどうかをじっくりご判断ください。無理な勧誘や、一方的なお申し込みのお願いは一切いたしません。
              &lt;/p&gt;
&lt;/div&gt;
&lt;/details&gt;
&lt;details&gt;
&lt;summary&gt;英語が全くできないのですが、大丈夫ですか？&lt;/summary&gt;
&lt;div class=&quot;details-body&quot;&gt;
&lt;p&gt;
                はい、もちろん大丈夫です。アルファベットの書き方から丁寧に指導します。実際に「英語が全くわからない」という状態から始めて、短期間で英検3級・4級に合格した生徒さんが多数います。まずは&lt;span class=&quot;semantic-unit&quot;&gt;体験授業&lt;/span&gt;でお気軽にご相談ください。
              &lt;/p&gt;
&lt;/div&gt;
&lt;/details&gt;
&lt;details&gt;
&lt;summary&gt;不登校の子供でも受講できますか？&lt;/summary&gt;
&lt;div class=&quot;details-body&quot;&gt;
&lt;p&gt;
                はい、不登校の生徒さんも多数受講しています。すべてオンライン（Zoom・&lt;span class=&quot;semantic-unit&quot;&gt;Google Meet&lt;/span&gt;）での授業なので、自宅の安心できる環境で学習できます。学校に通えていない状況でも、英検合格という目標を持つことで自信を取り戻した生徒さんもいます。
              &lt;/p&gt;
&lt;/div&gt;
&lt;/details&gt;
&lt;details&gt;
&lt;summary&gt;どの級から始めればよいかわかりません。&lt;/summary&gt;
&lt;div class=&quot;details-body&quot;&gt;
&lt;p&gt;
&lt;span class=&quot;semantic-unit&quot;&gt;体験授業&lt;/span&gt;の際に現在の英語力を確認し、最適な級をご提案します。一般的には、小学生は5〜4級、中学生は4〜2級、高校生は2〜準1級からスタートすることが多いです。
              &lt;/p&gt;
&lt;/div&gt;
&lt;/details&gt;
&lt;details&gt;
&lt;summary&gt;
&lt;span class=&quot;semantic-unit&quot;&gt;体験授業&lt;/span&gt;はありますか？料金はかかりますか？
            &lt;/summary&gt;
&lt;div class=&quot;details-body&quot;&gt;
&lt;p&gt;
                はい。初回のみ、&lt;span class=&quot;semantic-unit&quot;&gt;継続受講&lt;/span&gt;料金の半額です。コース別料金表の「体験」欄をご覧ください。ご相談は無料ですが、&lt;span class=&quot;semantic-unit&quot;&gt;体験授業&lt;/span&gt;は有料です。体験を通じて、お子様との相性・現在の課題・今後の学習の進め方をご確認いただけます。
              &lt;/p&gt;
&lt;/div&gt;
&lt;/details&gt;
&lt;details&gt;
&lt;summary&gt;オンライン授業はどのように行いますか？&lt;/summary&gt;
&lt;div class=&quot;details-body&quot;&gt;
&lt;p&gt;
                Zoomまたは&lt;span class=&quot;semantic-unit&quot;&gt;Google Meet&lt;/span&gt;を使用したビデオ通話形式で授業を行います。スマートフォン・タブレット・パソコンのいずれでも受講可能です。画面共有機能を使って過去問を一緒に解いたり、書き込みながら解説したりします。事前にアプリのインストール方法をご案内しますので、ITが苦手な方もご安心ください。
              &lt;/p&gt;
&lt;/div&gt;
&lt;/details&gt;
&lt;details&gt;
&lt;summary&gt;入会金や教材費はかかりますか？&lt;/summary&gt;
&lt;div class=&quot;details-body&quot;&gt;
&lt;p&gt;
                入会金は無料です。授業では市販の単語帳・問題集・参考書を生徒のレベルに合わせて講師が厳選して使用します。テキスト代は別途実費をいただく場合があります。詳しくはお問い合わせ時にご説明します。
              &lt;/p&gt;
&lt;/div&gt;
&lt;/details&gt;
&lt;details&gt;
&lt;summary&gt;月額サポートは必須ですか？&lt;/summary&gt;
&lt;div class=&quot;details-body&quot;&gt;
&lt;p&gt;
                月額サポート（10,000円／月）は任意です。授業料には、授業内での学習順序の調整、宿題、学び方の助言が含まれます。月額サポートでは、それに加えて書面の指導計画、保護者向けレポート、授業時間外の質問、希望者への面談をご利用いただけます。
              &lt;/p&gt;
&lt;/div&gt;
&lt;/details&gt;
&lt;details&gt;
&lt;summary&gt;
&lt;span class=&quot;semantic-unit&quot;&gt;大学受験&lt;/span&gt;では英語以外の科目も対応していますか？
            &lt;/summary&gt;
&lt;div class=&quot;details-body&quot;&gt;
&lt;p&gt;
&lt;span class=&quot;semantic-unit&quot;&gt;大学受験&lt;/span&gt;の文系科目が専門です。英語・国語（現代文・古文・漢文）・社会（世界史・日本史・地理・&lt;span class=&quot;semantic-unit&quot;&gt;政治経済&lt;/span&gt;・倫理・&lt;span class=&quot;semantic-unit&quot;&gt;歴史総合&lt;/span&gt;・公共）に対応しています。理系受験生の文系科目対策も対象です。
              &lt;/p&gt;
&lt;/div&gt;
&lt;/details&gt;
&lt;details&gt;
&lt;summary&gt;
&lt;span class=&quot;semantic-unit&quot;&gt;高校受験&lt;/span&gt;はどの地域に対応していますか？
            &lt;/summary&gt;
&lt;div class=&quot;details-body&quot;&gt;
&lt;p&gt;
                オンライン指導なので全国対応です。特に埼玉・千葉・茨城地区の公立・私立&lt;span class=&quot;semantic-unit&quot;&gt;高校受験&lt;/span&gt;に多数の合格実績があります。文系科目を中心に指導しており、標準レベルまでは数学・理科にも対応しています。内申点を上げて推薦入試を目指す方にも対応しています。
              &lt;/p&gt;
&lt;/div&gt;
&lt;/details&gt;
&lt;details&gt;
&lt;summary&gt;
              不登校の子どもの最初の授業はどのように進めますか？
            &lt;/summary&gt;
&lt;div class=&quot;details-body&quot;&gt;
&lt;p&gt;
                最初の授業ではまず「今どんな気持ちか」「何が苦手か」を丁寧にお聴きすることから始めます。&lt;span class=&quot;semantic-unit&quot;&gt;カメラオフ&lt;/span&gt;・&lt;span class=&quot;semantic-unit&quot;&gt;テキストチャット&lt;/span&gt;のみでの参加も大歓迎です。勉強の前に「安心できる場所」を作ることを大切にしており、小さな成功体験を積み重ねながら学習意欲を引き出していきます。保護者の方との連携も丁寧に行います。
              &lt;/p&gt;
&lt;/div&gt;
&lt;/details&gt;
&lt;details&gt;
&lt;summary&gt;
              今すぐ申し込んでも授業を受けられますか？キャンセル待ちになることはありますか？
            &lt;/summary&gt;
&lt;div class=&quot;details-body&quot;&gt;
&lt;p&gt;
                英検前・定期テスト前・長期休み期間・受験直前期（11〜2月）は、時間帯によってご案内までお待ちいただく場合があります。ご希望の曜日・時間帯・コースを早めにお知らせいただければ、現在の空き状況と開始時期をご案内します。
              &lt;/p&gt;
&lt;/div&gt;
&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;policy paper-section&quot; id=&quot;cancel-policy&quot; data-heading=&quot;overview&quot;&gt;
&lt;div class=&quot;section-shell narrow&quot;&gt;
&lt;div class=&quot;section-heading&quot;&gt;&lt;svg class=&quot;chapter-icon&quot; aria-hidden=&quot;true&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.5&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;&gt;&lt;circle cx=&quot;12&quot; cy=&quot;12&quot; r=&quot;9&quot;/&gt;&lt;circle cx=&quot;12&quot; cy=&quot;12&quot; r=&quot;5&quot;/&gt;&lt;path d=&quot;m10 12 2 2 7-9&quot;/&gt;&lt;/svg&gt;
&lt;p class=&quot;eyebrow&quot;&gt;BEFORE YOU START&lt;/p&gt;
&lt;h2 data-fit-lines=&quot;&quot; data-fit-min=&quot;20&quot;&gt;
&lt;span&gt;受講前に確認したい&lt;/span&gt;&lt;span&gt;お約束とキャンセル規定。&lt;/span&gt;
&lt;/h2&gt;
&lt;/div&gt;
&lt;p&gt;
            安心して受講をご検討いただけるよう、日程変更やキャンセルの条件を事前にご案内します。
          &lt;/p&gt;
&lt;div class=&quot;cancel-comparison&quot;&gt;&lt;article class=&quot;cancel-before&quot;&gt;&lt;svg aria-hidden=&quot;true&quot; class=&quot;line-icon&quot; fill=&quot;none&quot; height=&quot;48&quot; stroke=&quot;currentColor&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot; stroke-width=&quot;1.5&quot; viewbox=&quot;0 0 24 24&quot; width=&quot;48&quot;&gt;&lt;circle cx=&quot;12&quot; cy=&quot;12&quot; r=&quot;9&quot;&gt;&lt;/circle&gt;&lt;circle cx=&quot;12&quot; cy=&quot;12&quot; r=&quot;5&quot;&gt;&lt;/circle&gt;&lt;path d=&quot;m10 12 2 2 7-9&quot;&gt;&lt;/path&gt;&lt;/svg&gt;&lt;h3&gt;事前のご連絡&lt;/h3&gt;&lt;p class=&quot;cancel-deadline&quot;&gt;24&lt;small&gt;時間前まで&lt;/small&gt;&lt;/p&gt;&lt;strong&gt;原則、無償で振替&lt;/strong&gt;&lt;/article&gt;&lt;article class=&quot;cancel-after&quot;&gt;&lt;svg aria-hidden=&quot;true&quot; class=&quot;line-icon&quot; fill=&quot;none&quot; height=&quot;48&quot; stroke=&quot;currentColor&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot; stroke-width=&quot;1.5&quot; viewbox=&quot;0 0 24 24&quot; width=&quot;48&quot;&gt;&lt;path d=&quot;M21 15a3 3 0 0 1-3 3H9l-6 4V5a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3Z&quot;&gt;&lt;/path&gt;&lt;path d=&quot;M7 7h10M7 12h7&quot;&gt;&lt;/path&gt;&lt;/svg&gt;&lt;h3&gt;直前・無断キャンセル&lt;/h3&gt;&lt;p class=&quot;cancel-deadline&quot;&gt;24&lt;small&gt;時間前を過ぎた場合&lt;/small&gt;&lt;/p&gt;&lt;strong&gt;振替・返金不可&lt;/strong&gt;&lt;/article&gt;&lt;/div&gt;&lt;details&gt;
&lt;summary&gt;日程変更・キャンセルの条件を確認する&lt;/summary&gt;
&lt;div class=&quot;details-body&quot;&gt;
&lt;h3&gt;24時間前までのご連絡&lt;/h3&gt;
&lt;p&gt;原則として無償で振替対応します。&lt;/p&gt;
&lt;h3&gt;24時間前を過ぎたキャンセル・無断欠席&lt;/h3&gt;
&lt;p&gt;
                振替・返金はできません。体調不良などを含め、欠席理由による例外はありません。
              &lt;/p&gt;
&lt;h3&gt;継続受講について&lt;/h3&gt;
&lt;p&gt;
                1ヶ月の出席率が50％を下回った場合、または75％未満が2ヶ月続いた場合は、面談のうえ指導を終了することがあります。理由による例外はありません。
              &lt;/p&gt;
&lt;p&gt;
                他の方の受講機会と、授業のために確保する準備時間を守るための規定です。お申し込み前に、継続できる日程を一緒に確認します。
              &lt;/p&gt;
&lt;/div&gt;
&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;process ivory-section&quot; id=&quot;process&quot; data-heading=&quot;overview&quot;&gt;
&lt;div class=&quot;section-shell&quot;&gt;
&lt;div class=&quot;section-heading&quot;&gt;
&lt;svg class=&quot;chapter-icon&quot; aria-hidden=&quot;true&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.5&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;&gt;&lt;rect x=&quot;4&quot; y=&quot;3&quot; width=&quot;16&quot; height=&quot;19&quot; rx=&quot;2&quot;/&gt;&lt;path d=&quot;m7 8 1 1 2-2m-3 6 1 1 2-2m-3 6 1 1 2-2M13 8h4m-4 5h4m-4 5h4&quot;/&gt;&lt;/svg&gt;&lt;p class=&quot;eyebrow&quot;&gt;YOUR FIRST STEP&lt;/p&gt;
&lt;h2 data-fit-lines=&quot;&quot; data-fit-min=&quot;20&quot;&gt;
&lt;span&gt;&lt;span class=&quot;semantic-unit&quot;&gt;まずは、&lt;/span&gt;&lt;span class=&quot;semantic-unit&quot;&gt;ご相談から。&lt;/span&gt;&lt;/span&gt;&lt;span&gt;&lt;span class=&quot;semantic-unit&quot;&gt;始めるか&lt;/span&gt;&lt;span class=&quot;semantic-unit&quot;&gt;どうかは、&lt;/span&gt;&lt;span class=&quot;semantic-unit&quot;&gt;その後で。&lt;/span&gt;&lt;/span&gt;
&lt;/h2&gt;
&lt;/div&gt;
&lt;p class=&quot;section-lead&quot;&gt;&lt;span class=&quot;semantic-unit&quot;&gt;保護者の方だけの&lt;/span&gt;&lt;span class=&quot;semantic-unit&quot;&gt;&lt;span class=&quot;semantic-unit&quot;&gt;ご相談も&lt;/span&gt;&lt;span class=&quot;semantic-unit&quot;&gt;可能です。&lt;/span&gt;&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;semantic-unit&quot;&gt;いきなり入会を&lt;/span&gt;&lt;span class=&quot;semantic-unit&quot;&gt;決めていただく&lt;/span&gt;&lt;span class=&quot;semantic-unit&quot;&gt;&lt;span class=&quot;semantic-unit&quot;&gt;必要は&lt;/span&gt;&lt;span class=&quot;semantic-unit&quot;&gt;ありません。&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;
&lt;ol class=&quot;process-list&quot;&gt;&lt;li&gt;&lt;span&gt;01&lt;/span&gt;&lt;h3&gt;お問い合わせ&lt;/h3&gt;&lt;p&gt;&lt;span class=&quot;semantic-unit&quot;&gt;フォーム&lt;/span&gt;&lt;span class=&quot;semantic-unit&quot;&gt;またはメールで&lt;/span&gt;&lt;span class=&quot;semantic-unit&quot;&gt;ご連絡&lt;/span&gt;&lt;span class=&quot;semantic-unit&quot;&gt;ください。&lt;/span&gt;&lt;span class=&quot;semantic-unit&quot;&gt;保護者の方&lt;/span&gt;&lt;span class=&quot;semantic-unit&quot;&gt;だけでも&lt;/span&gt;&lt;span class=&quot;semantic-unit&quot;&gt;ご相談&lt;/span&gt;&lt;span class=&quot;semantic-unit&quot;&gt;いただけます。&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;
