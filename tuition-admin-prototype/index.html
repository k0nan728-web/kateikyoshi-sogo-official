<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>授業料計算・請求文作成｜管理画面の試作</title>
<style>body{font-family:system-ui,"Noto Sans JP",sans-serif;background:#f4f7fb;color:#142b45;margin:0}main{max-width:850px;margin:auto;padding:24px 16px 80px}h1{font-size:clamp(23px,4vw,34px)}.note{background:#fff3da;padding:14px;border-radius:10px;line-height:1.7}.panel{background:white;border:1px solid #d9e2ec;border-radius:16px;padding:20px;margin-top:18px}label{display:block;font-weight:700;margin:12px 0 5px}input,select,textarea{font:inherit;box-sizing:border-box;width:100%;padding:11px;border:1px solid #9eb0c3;border-radius:8px;background:#fff}textarea{min-height:220px}button{border:0;border-radius:9px;background:#155c80;color:white;font:inherit;font-weight:700;padding:13px 18px;cursor:pointer;margin-top:14px}button:focus-visible{outline:3px solid #f5a623}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.amount{font-size:30px;font-weight:800;margin:8px 0}small{color:#536578} @media(max-width:520px){.grid{grid-template-columns:1fr}} </style></head>
<body><main><h1>授業料計算・請求文作成</h1><p class="note"><strong>試作版・本番運用禁止</strong>：ログイン認証・サーバー保存・入金照合は未実装です。実際の生徒名・連絡先などの個人情報を入力しないでください。入力内容は保存・送信されません。公式サイトの他ページにはリンクしていません。</p>
<section class="panel"><h2>翌月の請求額</h2><div class="grid"><div><label for="course">コース</label><select id="course"><option value="4000">英検5級</option><option value="4500">英検4級</option><option value="5000">英検3級</option><option value="5500">英検準2級</option><option value="6000">英検準2級プラス</option><option value="6500" selected>英検2級</option><option value="7000">英検準1級</option><option value="custom">その他（単価を手入力）</option></select></div><div><label for="unit">60分あたりの単価（税込・円）</label><input id="unit" type="number" min="0" max="100000" step="100" value="6500"></div><div><label for="duration">1回の授業時間</label><select id="duration"><option value="60">60分</option><option value="90">90分</option><option value="120">120分</option></select></div><div><label for="count">翌月の授業回数</label><input id="count" type="number" min="0" max="31" step="1" value="4"></div><div><label for="discount">無料授業回数（継続特典など）</label><input id="discount" type="number" min="0" max="31" step="1" value="0"></div><div><label for="adjust">その他調整額（税込・円、減額はマイナス）</label><input id="adjust" type="number" min="-1000000" max="1000000" step="1" value="0"></div><div><label for="month">対象月</label><input id="month" type="month"></div><div><label for="due">お支払い期限</label><input id="due" type="date"></div></div><p id="formula"></p><div id="total" class="amount" aria-live="polite">26,000円</div><small>試算用です。実際の料金規定・個別契約・端数処理を確認してください。</small></section>
<section class="panel"><h2>請求案内文</h2><textarea id="message" readonly aria-label="請求案内文"></textarea><button id="copy" type="button">請求案内文をコピー</button><p id="status" role="status"></p></section></main>
<script>
"use strict";
const $=id=>document.getElementById(id);
const ids=["unit","duration","count","discount","adjust","month","due"];
const yen=n=>new Intl.NumberFormat("ja-JP").format(n)+"円";
function recalc(){
 const unit=Number($("unit").value),duration=Number($("duration").value),count=Number($("count").value),free=Number($("discount").value),adjust=Number($("adjust").value);
 const valid=[unit,duration,count,free,adjust].every(Number.isFinite)&&unit>=0&&unit<=100000&&Number.isInteger(count)&&count>=0&&count<=31&&Number.isInteger(free)&&free>=0&&free<=count&&Math.abs(adjust)<=1000000;
 if(!valid){$("total").textContent="入力内容をご確認ください";$("formula").textContent="";$("message").value="";$("copy").disabled=true;return;}
 const per=unit*duration/60;const subtotal=per*(count-free);const total=subtotal+adjust;
 if(!Number.isInteger(per)||!Number.isInteger(total)||total<0){$("total").textContent="端数・調整額を確認してください";$("message").value="";$("copy").disabled=true;return;}
 $("copy").disabled=false;
 $("formula").textContent=yen(per)+" × 請求対象 "+(count-free)+"回（全"+count+"回・無料"+free+"回）"+(adjust?" ＋ 調整 "+yen(adjust):"");
 $("total").textContent=yen(total);
 const month=$("month").value||"翌月",due=$("due").value||"前月末日";
 $("message").value="【"+month+"分 授業料のご案内】\n授業回数："+count+"回\n授業時間："+duration+"分／回\n60分単価："+yen(unit)+"\n無料授業："+free+"回\nその他調整："+yen(adjust)+"\nお支払い金額："+yen(total)+"（税込）\nお支払い期限："+due+"\nご確認のほどよろしくお願いいたします。";
}
$("course").addEventListener("change",()=>{if($("course").value!=="custom")$("unit").value=$("course").value;recalc();});
ids.forEach(id=>$(id).addEventListener("input",recalc));
$("copy").addEventListener("click",async()=>{try{await navigator.clipboard.writeText($("message").value);$("status").textContent="コピーしました。";}catch{$("status").textContent="コピーできませんでした。文章を選択してコピーしてください。";}});
recalc();
</script></body></html>
