name: Verify five production sites after deployment
on:
  push:
    branches: [main]
    paths: ['index.html', 'eiken/**', 'gyakuten/**', 'bansou/**', 'retry/**', 'hikaku/**', 'parent-guide.css', 'responsive-copy.js', '404.html', 'robots.txt']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: node docs/audit-20261103/production-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: five-site-production-${{ github.sha }}
          path: production-results/
          retention-days: 14
