name: Verify five production sites after deployment
on:
  push:
    branches: [main]
    paths: ['index.html', 'eiken/**', 'gyakuten/**', 'bansou/**', 'retry/**', 'hikaku/**', 'parent-guide.css', 'parent-colour.css', 'first-visit.css', 'responsive-copy.js', '404.html', 'robots.txt', 'docs/audit-20261103/production-smoke.mjs', '.github/workflows/five-site-production.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: node docs/audit-20261103/production-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: five-site-production-${{ github.sha }}
          path: production-results/
          retention-days: 14
  production-mobile-lab:
    needs: read-only-production-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm install --no-save playwright@1.56.1 lighthouse@12.8.2
          npx playwright install --with-deps chromium
      - name: Measure deployed pages without submitting forms
        run: PERFORMANCE_PRODUCTION=1 node tools/performance-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: five-site-production-performance-${{ github.sha }}
          path: performance-results/
          retention-days: 14
