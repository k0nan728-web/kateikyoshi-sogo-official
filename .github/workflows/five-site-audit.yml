name: Five site responsive and accessibility audit
on:
  push:
    branches: [main]
    paths: ['index.html', 'eiken/**', 'gyakuten/**', 'bansou/**', 'retry/**', 'blog/**', 'growth-sections.js', 'sitemap.xml', 'parent-guide.css', 'parent-colour.css', 'first-visit.css', 'responsive-copy.js', 'responsive-copy.css', 'media/**', 'tools/**', '.github/workflows/five-site-audit.yml']
  pull_request:
    paths: ['index.html', 'eiken/**', 'gyakuten/**', 'bansou/**', 'retry/**', 'blog/**', 'growth-sections.js', 'sitemap.xml', 'parent-guide.css', 'parent-colour.css', 'first-visit.css', 'responsive-copy.js', 'responsive-copy.css', 'media/**', 'tools/**', '.github/workflows/five-site-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Install isolated audit dependencies
        run: |
          npm install --no-save playwright@1.56.1 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium webkit
      - name: Existing form and billing regression tests
        run: |
          node tools/termination-policy.mjs --check
          node tools/billing-policy.mjs --check
          node intake/validate.test.mjs
          node intake/native-delivery.test.mjs
          node --test tuition-portal/security.test.mjs
      - name: Assemble static preview
        run: |
          node tools/build-preview.mjs
          python3 -m http.server 4173 --directory dist >/tmp/five-site-server.log 2>&1 &
      - name: SEO article pages, metadata, structured data and sitemap
        run: node tools/seo-content-audit.mjs
      - name: Isolated form success and failure UI
        run: node tools/form-ui-audit.mjs
      - name: Verify calculator amounts and surcharge boundaries
        if: always()
        run: node tools/calculator-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: five-site-functional-${{ github.sha }}
          path: |
            audit-results/form*
            audit-results/*form*
            audit-results/calculator*
          retention-days: 14
      - name: Parent questions, keyboard reading order and free consultation handoff
        if: always()
        run: node tools/parent-journey-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parent-journeys-${{ github.sha }}
          path: parent-journey-results/
          retention-days: 14
      - name: Chromium and WebKit at seven widths
        if: always()
        run: node tools/browser-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone-payment-gutters-${{ github.sha }}
          path: |
            audit-results/*payment-414.png
            audit-results/matrix.json
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: five-site-audit-${{ github.sha }}
          path: audit-results/
          retention-days: 14
  mobile-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm install --no-save playwright@1.56.1 lighthouse@12.8.2
          npx playwright install --with-deps chromium
      - name: Serve baseline and proposed static sites
        run: |
          git fetch --depth=1 origin 9005420601f86db6ebfea72f0ef0558a620ac20e
          mkdir -p /tmp/site-baseline
          git archive 9005420601f86db6ebfea72f0ef0558a620ac20e | tar -x -C /tmp/site-baseline
          node tools/build-preview.mjs
          python3 -m http.server 4173 --directory dist >/tmp/after-server.log 2>&1 &
          python3 -m http.server 4174 --directory /tmp/site-baseline >/tmp/before-server.log 2>&1 &
      - name: Compare five sites under mobile lab conditions
        run: node tools/performance-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: five-site-performance-${{ github.sha }}
          path: performance-results/
          retention-days: 14
