name: Check native form delivery readiness
on:
  push:
    branches:
      - fix/intake-delivery-readiness-20261012
    paths:
      - '.github/workflows/check-intake-delivery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-production:
    runs-on: ubuntu-latest
    steps:
      - name: Probe actual public API without submitting private data
        shell: bash
        run: |
          node <<'JS'
          const base='https://kateikyoshi-sogo.com';
          const endpoints=['/apply/','/contact/','/api/intake'];
          for(const path of endpoints){
            const controller=new AbortController();
            const timer=setTimeout(()=>controller.abort(),15000);
            try{
              const response=await fetch(base+path,{signal:controller.signal,headers:{'User-Agent':'IntakeReadinessAudit/1.0'}});
              console.log(path+' HTTP '+response.status);
              if(!response.ok)process.exitCode=1;
              if(path==='/api/intake'&&response.ok){
                const status=await response.json();
                console.log('NATIVE_DELIVERY_CONFIGURED='+String(status.available===true));
                console.log('TURNSTILE_PUBLIC_SITE_KEY_PRESENT='+String(Boolean(status.turnstileSiteKey)));
                console.log('FALLBACK_AVAILABLE='+String(Boolean(status.fallbackUrl)));
                if(status.available!==true)console.log('BLOCKER: Cloudflare Pages Production secrets and verified sender must be configured outside GitHub.');
              }
            }catch(e){console.log(path+' PROBE ERROR: '+e.message);process.exitCode=1;}
            finally{clearTimeout(timer);}
          }
          JS
