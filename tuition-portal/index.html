<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>授業料マイページ｜家庭教師総合</title><style>body{font-family:system-ui,"Noto Sans JP",sans-serif;background:#f3f7fb;color:#152e49;margin:0}main{max-width:900px;margin:auto;padding:25px 16px 70px}h1{font-size:clamp(22px,4vw,32px)}.card{background:#fff;border:1px solid #d7e0e9;border-radius:14px;padding:20px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}label{display:block;font-weight:700;margin:12px 0 5px}input,select{font:inherit;width:100%;box-sizing:border-box;padding:11px;border:1px solid #9fb0c3;border-radius:8px}button{font:inherit;font-weight:700;background:#145f83;color:white;border:0;border-radius:8px;padding:11px 16px;margin:12px 8px 0 0;cursor:pointer}button:disabled{opacity:.5}table{border-collapse:collapse;width:100%;font-size:14px}td,th{border-bottom:1px solid #d7e0e9;padding:10px 5px;text-align:left}small{color:#54677b}.scroll{overflow-x:auto}.hidden{display:none}.status{min-height:24px;color:#8a341a}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><main><h1>授業料・お支払いマイページ</h1><p>登録済みメールアドレスに届く6桁の確認コードでログインします。</p><p id="status" class="status" role="status" aria-live="polite"></p>
<section id="login" class="card"><h2>ログイン</h2><label for="email">登録メールアドレス</label><input id="email" type="email" autocomplete="email"><button id="send">確認コードを送信</button><label for="code">確認コード（6桁）</label><input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6"><button id="verify">ログイン</button></section>
<section id="portal" class="hidden"><div class="card"><p id="welcome"></p><button id="logout">ログアウト</button></div><section id="admin" class="hidden"><div class="card"><h2>保護者登録（管理者のみ）</h2><div class="grid"><div><label for="pname">保護者表示名</label><input id="pname" maxlength="100"></div><div><label for="pemail">保護者メール</label><input id="pemail" type="email"></div></div><button id="addParent">登録</button><div id="parentAccounts"></div></div><div class="card"><h2>請求作成（管理者のみ）</h2><div class="grid"><div><label for="parent">保護者</label><select id="parent"></select></div><div><label for="period">対象月</label><input id="period" type="month"></div><div><label for="course">コース</label><input id="course" value="英検2級"></div><div><label for="unit">60分単価（税込）</label><input id="unit" type="number" min="0" value="6500"></div><div><label for="duration">授業時間</label><select id="duration"><option value="60">60分</option><option value="90">90分</option><option value="120">120分</option></select></div><div><label for="count">回数</label><input id="count" type="number" min="0" max="31" value="4"></div><div><label for="free">無料授業回数</label><input id="free" type="number" min="0" max="31" value="0"></div><div><label for="adjust">調整額（円）</label><input id="adjust" type="number" value="0"></div><div><label for="due">支払期限</label><input id="due" type="date"></div></div><p id="preview"></p><button id="createInvoice">請求を確定</button></div></section><div class="card"><h2>請求・入金履歴</h2><p><small>入金状況は先生が確認・更新した内容です。銀行との自動照合ではありません。</small></p><div class="scroll"><table><thead><tr><th id="parentHeader">保護者</th><th>対象月</th><th>内容</th><th>請求額</th><th>期限</th><th>状態</th><th id="actionHeader"></th></tr></thead><tbody id="invoices"></tbody></table></div></div></section></main><script>
"use strict";const $=id=>document.getElementById(id);let me=null;let invoiceRequest=null;
async function api(path,body){const res=await fetch("/api/tuition/"+path,{method:body?"POST":"GET",credentials:"same-origin",headers:body?{"Content-Type":"application/json"}:{},body:body?JSON.stringify(body):undefined,cache:"no-store"});const data=await res.json();if(!res.ok){if(res.status===401){me=null;$("portal").classList.add("hidden");$("admin").classList.add("hidden");$("login").classList.remove("hidden");$("invoices").replaceChildren();$("parent").replaceChildren();}throw Error(data.error||"処理できませんでした");}return data;}
function say(s){$("status").textContent=s;}
function el(tag,value){const n=document.createElement(tag);n.textContent=String(value??"");return n;}
async function refresh(){const data=await api("invoices");const body=$("invoices");body.replaceChildren();for(const i of data.invoices){const tr=document.createElement("tr");[...(me.role==="admin"?[i.parent_name]:[]),i.period,i.course+" "+i.duration_min+"分×"+i.lesson_count+"回（無料"+i.free_count+"回）",i.amount_yen.toLocaleString()+"円",i.due_date,i.status==="paid"?"入金済":"入金待ち"].forEach(v=>tr.append(el("td",v)));const td=document.createElement("td");if(me.role==="admin"){const b=el("button",i.status==="paid"?"未入金に戻す":"入金済にする");b.onclick=async()=>{try{await api("payment",{id:i.id,status:i.status==="paid"?"unpaid":"paid",version:i.version});await refresh();}catch(e){say(e.message);}};td.append(b);}tr.append(td);body.append(tr);}if(!data.invoices.length){const tr=document.createElement("tr"),td=el("td","請求履歴はまだありません。");td.colSpan=me.role==="admin"?7:6;tr.append(td);body.append(tr);}}
async function parents(){const data=await api("parents");$("parent").replaceChildren();$("parentAccounts").replaceChildren();for(const p of data.parents){const row=el("p",p.display_name+"："+(p.active?"有効":"停止中"));const b=el("button",p.active?"利用停止":"再開");b.onclick=async()=>{if(!confirm(p.display_name+" 様の利用を"+(p.active?"停止":"再開")+"しますか？"))return;try{await api("parent-status",{id:p.id,active:p.active?0:1});await parents();}catch(e){say(e.message);}};row.append(b);$("parentAccounts").append(row);if(!p.active)continue;const opt=el("option",p.display_name+" ("+p.email+")");opt.value=p.id;$("parent").append(opt);}}
async function init(){try{const r=await api("me");me=r.user;$("login").classList.add("hidden");$("portal").classList.remove("hidden");$("welcome").textContent=me.name+" 様（"+(me.role==="admin"?"管理者":"保護者")+"）";$("parentHeader").classList.toggle("hidden",me.role!=="admin");$("actionHeader").textContent=me.role==="admin"?"入金管理":"";if(me.role==="admin"){$("admin").classList.remove("hidden");await parents();}await refresh();}catch(e){say(e.message);$("admin").classList.add("hidden");$("login").classList.remove("hidden");$("portal").classList.add("hidden");}}
$("send").onclick=async()=>{try{await api("request-code",{email:$("email").value});say("登録済みの場合、確認コードを送信します。");}catch(e){say(e.message);}};
$("verify").onclick=async()=>{try{await api("verify",{email:$("email").value,code:$("code").value});$("code").value="";say("");await init();}catch(e){say(e.message);}};
$("logout").onclick=async()=>{try{await api("logout",{});location.reload();}catch(e){say(e.message);}};
$("addParent").onclick=async()=>{try{await api("parents",{name:$("pname").value,email:$("pemail").value});say("保護者を登録しました。");await parents();}catch(e){say(e.message);}};
function amount(){return Number($("unit").value)*Number($("duration").value)/60*(Number($("count").value)-Number($("free").value))+Number($("adjust").value);}
["unit","duration","count","free","adjust"].forEach(id=>$(id).addEventListener("input",()=>{$("preview").textContent="請求予定額："+(Number.isFinite(amount())?amount().toLocaleString()+"円":"入力を確認してください");}));
$("createInvoice").onclick=async()=>{try{const payload={parent_id:$("parent").value,period:$("period").value,course:$("course").value,unit_yen:Number($("unit").value),duration_min:Number($("duration").value),lesson_count:Number($("count").value),free_count:Number($("free").value),adjustment_yen:Number($("adjust").value),due_date:$("due").value};if(!confirm("請求額 "+amount().toLocaleString()+"円を確定しますか？"))return;const fingerprint=JSON.stringify(payload);if(!invoiceRequest||invoiceRequest.fingerprint!==fingerprint)invoiceRequest={fingerprint,id:crypto.randomUUID()};await api("invoices",{...payload,request_id:invoiceRequest.id});invoiceRequest=null;say("請求を登録しました。");await refresh();}catch(e){say(e.message);}};
for(const id of ["send","verify","addParent","createInvoice"]){const b=$(id),action=b.onclick;b.onclick=async()=>{if(b.disabled)return;b.disabled=true;try{await action();}finally{b.disabled=false;}};}
$("preview").textContent="請求予定額："+amount().toLocaleString()+"円";
init();
</script></body></html>
