<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 850" width="860" height="850" role="img" aria-labelledby="asset-title asset-desc">
<title id="asset-title">学習計画・面談カルテ・進捗チェック</title>
<desc id="asset-desc">英単語、文法、長文、リスニング、ライティングの週間計画と、面談記録や学習進捗を3枚の資料として示したイメージ</desc>
