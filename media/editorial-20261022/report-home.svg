<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img"><title>学習進捗・指導報告書</title><defs><filter id="shadow" x="-20%" y="-20%" width="150%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#183c4c" flood-opacity=".13"/></filter></defs><rect x="0" y="0" width="1200" height="840" rx="0" fill="#edf1f7"/><rect x="86" y="55" width="1028" height="728" rx="10" fill="#fff" filter="url(#shadow)"/><rect x="86" y="55" width="1028" height="12" rx="5" fill="#276959"/><g font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif"><text x="135" y="127" font-size="39" fill="#244450" font-weight="700">学習進捗・指導報告書</text><text x="135" y="169" font-size="22" fill="#536c70" font-weight="400">取り組み・理解度・今後の課題を共有</text><rect x="920" y="97" width="135" height="44" rx="22" fill="#f1eddf"/><text x="946" y="128" font-size="23" fill="#785f31" font-weight="700">見本</text><rect x="135" y="222" width="920" height="119" rx="5" fill="#edf5f2"/><text x="163" y="265" font-size="28" fill="#244450" font-weight="700">今回取り組んだこと</text><text x="163" y="309" font-size="25" fill="#244450" font-weight="400">授業の内容と、確認したポイント</text><rect x="135" y="363" width="920" height="119" rx="5" fill="#f0f4fa"/><text x="163" y="406" font-size="28" fill="#244450" font-weight="700">できるようになったこと</text><text x="163" y="450" font-size="25" fill="#244450" font-weight="400">理解が進んだ点・次につながる変化</text><rect x="135" y="504" width="920" height="119" rx="5" fill="#fbf4e8"/><text x="163" y="547" font-size="28" fill="#244450" font-weight="700">次回までの課題</text><text x="163" y="591" font-size="25" fill="#244450" font-weight="400">復習する範囲と、次に取り組むこと</text><rect x="135" y="680" width="920" height="65" rx="4" fill="#184b4b"/><text x="163" y="722" font-size="26" fill="white" font-weight="700">学びの様子を、ご家庭にも分かりやすく。</text></g></svg>