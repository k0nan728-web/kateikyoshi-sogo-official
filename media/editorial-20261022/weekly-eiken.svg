<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img"><title>1週間の学習計画</title><defs><filter id="shadow" x="-20%" y="-20%" width="150%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#183c4c" flood-opacity=".13"/></filter></defs><rect x="0" y="0" width="1200" height="840" rx="0" fill="#f4f2e9"/><rect x="86" y="55" width="1028" height="728" rx="10" fill="#fff" filter="url(#shadow)"/><rect x="86" y="55" width="1028" height="12" rx="5" fill="#276959"/><g font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif"><text x="135" y="127" font-size="39" fill="#244450" font-weight="700">1週間の学習計画</text><text x="135" y="169" font-size="22" fill="#536c70" font-weight="400">毎日の「何をする？」を見える形に</text><rect x="920" y="97" width="135" height="44" rx="22" fill="#f1eddf"/><text x="946" y="128" font-size="23" fill="#785f31" font-weight="700">見本</text><rect x="135" y="218" width="920" height="57" rx="4" fill="#f1f6f3"/><text x="161" y="256" font-size="25" fill="#286855" font-weight="700">月</text><text x="251" y="256" font-size="26" fill="#244450" font-weight="400">語彙の復習</text><rect x="910" y="234" width="25" height="25" rx="3" fill="white" stroke="#8caaa0" stroke-width="2"/><rect x="135" y="283" width="920" height="57" rx="4" fill="#fff"/><text x="161" y="321" font-size="25" fill="#286855" font-weight="700">火</text><text x="251" y="321" font-size="26" fill="#244450" font-weight="400">文法を確認</text><rect x="910" y="299" width="25" height="25" rx="3" fill="white" stroke="#8caaa0" stroke-width="2"/><rect x="135" y="348" width="920" height="57" rx="4" fill="#f1f6f3"/><text x="161" y="386" font-size="25" fill="#286855" font-weight="700">水</text><text x="251" y="386" font-size="26" fill="#244450" font-weight="400">読解を練習</text><rect x="910" y="364" width="25" height="25" rx="3" fill="white" stroke="#8caaa0" stroke-width="2"/><rect x="135" y="413" width="920" height="57" rx="4" fill="#fff"/><text x="161" y="451" font-size="25" fill="#286855" font-weight="700">木</text><text x="251" y="451" font-size="26" fill="#244450" font-weight="400">音声を聞く</text><rect x="910" y="429" width="25" height="25" rx="3" fill="white" stroke="#8caaa0" stroke-width="2"/><rect x="135" y="478" width="920" height="57" rx="4" fill="#f1f6f3"/><text x="161" y="516" font-size="25" fill="#286855" font-weight="700">金</text><text x="251" y="516" font-size="26" fill="#244450" font-weight="400">英作文</text><rect x="910" y="494" width="25" height="25" rx="3" fill="white" stroke="#8caaa0" stroke-width="2"/><rect x="135" y="543" width="920" height="57" rx="4" fill="#fff"/><text x="161" y="581" font-size="25" fill="#286855" font-weight="700">土</text><text x="251" y="581" font-size="26" fill="#244450" font-weight="400">授業・確認</text><rect x="910" y="559" width="25" height="25" rx="3" fill="white" stroke="#8caaa0" stroke-width="2"/><rect x="135" y="608" width="920" height="57" rx="4" fill="#f1f6f3"/><text x="161" y="646" font-size="25" fill="#286855" font-weight="700">日</text><text x="251" y="646" font-size="26" fill="#244450" font-weight="400">解き直し</text><rect x="910" y="624" width="25" height="25" rx="3" fill="white" stroke="#8caaa0" stroke-width="2"/><text x="135" y="723" font-size="24" fill="#244450" font-weight="700">生活リズムに合わせて、無理のない量へ。</text><text x="135" y="757" font-size="21" fill="#536c70" font-weight="400">書面の個別計画：任意の月額サポート</text></g></svg>