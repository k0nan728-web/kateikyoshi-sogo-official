<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img"><title>英検4技能の学習カリキュラム</title><defs><filter id="shadow" x="-20%" y="-20%" width="150%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#183c4c" flood-opacity=".13"/></filter></defs><rect x="0" y="0" width="1200" height="840" rx="0" fill="#edf4f0"/><rect x="86" y="55" width="1028" height="728" rx="10" fill="#fff" filter="url(#shadow)"/><rect x="86" y="55" width="1028" height="12" rx="5" fill="#276959"/><g font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif"><text x="135" y="127" font-size="39" fill="#244450" font-weight="700">英検4技能の学習カリキュラム</text><text x="135" y="169" font-size="22" fill="#536c70" font-weight="400">今できることから、次に取り組むことへ</text><rect x="920" y="97" width="135" height="44" rx="22" fill="#f1eddf"/><text x="946" y="128" font-size="23" fill="#785f31" font-weight="700">見本</text><rect x="135" y="217" width="920" height="97" rx="6" fill="#edf5f2"/><text x="159" y="275" font-size="33" fill="#9a7c3e" font-weight="700">01</text><text x="244" y="257" font-size="28" fill="#244450" font-weight="700">語彙・文法</text><text x="244" y="293" font-size="24" fill="#244450" font-weight="400">基礎を確認し、学び直す</text><rect x="135" y="334" width="920" height="97" rx="6" fill="#f0f4fa"/><text x="159" y="392" font-size="33" fill="#9a7c3e" font-weight="700">02</text><text x="244" y="374" font-size="28" fill="#244450" font-weight="700">読む・聞く</text><text x="244" y="410" font-size="24" fill="#244450" font-weight="400">根拠と音声のポイントを確認</text><rect x="135" y="451" width="920" height="97" rx="6" fill="#fbf4e8"/><text x="159" y="509" font-size="33" fill="#9a7c3e" font-weight="700">03</text><text x="244" y="491" font-size="28" fill="#244450" font-weight="700">書く・話す</text><text x="244" y="527" font-size="24" fill="#244450" font-weight="400">構成を整え、自分の言葉で表現</text><rect x="135" y="568" width="920" height="97" rx="6" fill="#f4f0f7"/><text x="159" y="626" font-size="33" fill="#9a7c3e" font-weight="700">04</text><text x="244" y="608" font-size="28" fill="#244450" font-weight="700">総仕上げ</text><text x="244" y="644" font-size="24" fill="#244450" font-weight="400">過去問・模擬面接で確認</text><text x="135" y="742" font-size="22" fill="#244450" font-weight="400">目標級・試験日・苦手な技能に合わせて調整。</text></g></svg>